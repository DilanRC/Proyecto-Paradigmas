name: Limpieza puntual de ramas (temporal)
on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'DilanRC/Proyecto-Paradigmas'
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup-legacy-branches-once
      cancel-in-progress: false
    steps:
      - name: Verificar, respaldar y eliminar ramas antiguas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          declare -A expected=(
            ['DBA']='a911cbdba64883005d8094ba5f0d7fdc8f2dc80f'
            ['QA']='e339e89d5ec25010e625ab142d7deca7f721a767'
            ['Revicion/errorHead']='c6818a48f7aaf6b0c8b1ffcb0dd6a654975bfede'
            ['backend']='b90a2f28f8b60278edf364e37d013c43b16bc093'
            ['feat/Front-2.0']='eeddba084346203cebe8284c0436f8cf5376696b'
            ['feat/instalar-local']='0069f48541ab53e239c9fe156df570a1625b5e35'
            ['feat/instalar-local-linux']='2c7824fbeb0e03c826667eb226217866ae4c2b63'
            ['fix/vercel-ramas-y-poda']='4ee5645c4e613d513ba229d380d4f40cd8ab5b9f'
            ['fix/xampp-linux-local']='bd281d5e6ed97317db9c43c2b37d56523f2e6ae6'
            ['jefersonbustamante']='a0f6cc028976b710ff0ce56e263a466bbad9e9c4'
            ['test/Validaciones']='7f24c013e6e60be0406b9ff3a3852ebd20cbca71'
          )
          expected_main='58ea3c1983df40b47803e09a8eda48917e3f6465'
          [[ "$GITHUB_REF" == 'refs/heads/dev' ]]
          [[ "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" == "$expected_main" ]]
          [[ "$(gh api "repos/$repo/git/ref/heads/dev" --jq '.object.sha')" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$repo/pulls?state=open&per_page=1" --jq 'length')" == '0' ]]
          mapfile -t actual < <(gh api "repos/$repo/branches?per_page=100" --jq '.[].name')
          [[ "${#actual[@]}" -eq 13 ]] || { echo 'Unexpected branch count; aborting'; exit 1; }
          for name in "${actual[@]}"; do
            if [[ "$name" != main && "$name" != dev && -z "${expected[$name]+x}" ]]; then
              echo "Unexpected branch: $name; aborting"
              exit 1
            fi
          done
          for name in "${!expected[@]}"; do
            sha="$(gh api "repos/$repo/git/ref/heads/$name" --jq '.object.sha')"
            [[ "$sha" == "${expected[$name]}" ]] || { echo "Branch $name changed; aborting"; exit 1; }
          done
          echo 'All 13 branch names and 11 obsolete SHAs verified.'

          # Preserve every divergent branch's unique commits as an immutable tag.
          for name in 'DBA' 'QA' 'test/Validaciones'; do
            case "$name" in
              'DBA') tag='archive/branches/DBA-2026-11-18' ;;
              'QA') tag='archive/branches/QA-2026-11-18' ;;
              'test/Validaciones') tag='archive/branches/test-Validaciones-2026-11-18' ;;
            esac
            # Create the backup only if GitHub accepts the exact ref. Never overwrite a tag.
            gh api -X POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=${expected[$name]}" --silent
            echo "History preserved: $name -> $tag"
          done

          # Re-check the SHA just before each destructive request.
          for name in "${!expected[@]}"; do
            sha="$(gh api "repos/$repo/git/ref/heads/$name" --jq '.object.sha')"
            [[ "$sha" == "${expected[$name]}" ]] || { echo "Branch $name changed; stop"; exit 1; }
            gh api -X DELETE "repos/$repo/git/refs/heads/$name" --silent
            echo "Removed branch: $name"
          done
          mapfile -t remaining < <(gh api "repos/$repo/branches?per_page=100" --jq '.[].name')
          [[ "${#remaining[@]}" -eq 2 ]] || { echo "Expected two remaining branches"; exit 1; }
          [[ " ${remaining[*]} " == *" dev "* && " ${remaining[*]} " == *" main "* ]] || exit 1
          echo 'SUCCESS: Only main and dev remain. Three divergent tips are tagged.'
