services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/SqlScripts/001_create_database.sql:/docker-entrypoint-initdb.d/001_create_database.sql:ro
      - ./Database/SqlScripts/002_create_catalogs.sql:/docker-entrypoint-initdb.d/002_create_catalogs.sql:ro
      - ./Database/SqlScripts/003_create_participante_schema.sql:/docker-entrypoint-initdb.d/003_create_participante_schema.sql:ro
      - ./Database/SqlScripts/004_create_productor_finca.sql:/docker-entrypoint-initdb.d/004_create_productor_finca.sql:ro
      - ./Database/SqlScripts/005_create_audit.sql:/docker-entrypoint-initdb.d/005_create_audit.sql:ro
      - ./Database/SeedData/101_identification_types.sql:/docker-entrypoint-initdb.d/101_identification_types.sql:ro
      - ./Database/SeedData/102_roles.sql:/docker-entrypoint-initdb.d/102_roles.sql:ro
      - ./Database/SeedData/103_example_productores.sql:/docker-entrypoint-initdb.d/103_example_productores.sql:ro
    healthcheck:
      # TCP no está disponible en el servidor temporal de inicialización. Esto
      # evita marcar healthy antes de que las semillas terminen y MySQL reinicie.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
