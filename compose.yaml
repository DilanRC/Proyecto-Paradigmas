services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/SqlScripts/001createdatabase.sql:/docker-entrypoint-initdb.d/001createdatabase.sql:ro
      - ./Database/SqlScripts/002createproductores.sql:/docker-entrypoint-initdb.d/002createproductores.sql:ro
      - ./Database/SqlScripts/003createproductoresdireccion.sql:/docker-entrypoint-initdb.d/003createproductoresdireccion.sql:ro
      - ./Database/SqlScripts/004createfinca.sql:/docker-entrypoint-initdb.d/004createfinca.sql:ro
      - ./Database/SqlScripts/005createaudit.sql:/docker-entrypoint-initdb.d/005createaudit.sql:ro
      - ./Database/SqlScripts/006createcomprador.sql:/docker-entrypoint-initdb.d/006createcomprador.sql:ro
      - ./Database/SqlScripts/007createdireccion.sql:/docker-entrypoint-initdb.d/007createdireccion.sql:ro
      - ./Database/SqlScripts/008createfincadireccion.sql:/docker-entrypoint-initdb.d/008createfincadireccion.sql:ro
      - ./Database/SqlScripts/009createpagometodo.sql:/docker-entrypoint-initdb.d/009createpagometodo.sql:ro
      - ./Database/SqlScripts/010createtransportista.sql:/docker-entrypoint-initdb.d/010createtransportista.sql:ro
      - ./Database/SqlScripts/011createvehiculo.sql:/docker-entrypoint-initdb.d/011createvehiculo.sql:ro
      - ./Database/SqlScripts/012createtransportistavehiculo.sql:/docker-entrypoint-initdb.d/012createtransportistavehiculo.sql:ro
      - ./Database/SeedData/101initialpagometodo.sql:/docker-entrypoint-initdb.d/101initialpagometodo.sql:ro
      - ./Database/SeedData/103exampleproductores.sql:/docker-entrypoint-initdb.d/103exampleproductores.sql:ro
    healthcheck:
      # TCP no está disponible en el servidor temporal de inicialización. Esto
      # evita marcar healthy antes de que las semillas terminen y MySQL reinicie.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  supabase-server:
    build:
      context: ./services/supabase-server
    ports:
      - "127.0.0.1:${SUPABASE_SERVER_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:
